name: verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · types · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # `npm ci` installs strictly from the lockfile, so CI cannot silently
      # resolve different versions than the ones verified locally.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Includes the design guards: WCAG contrast ratios computed from the
      # tokens, plus scans for wild spacing and raw hex in components.
      - name: Unit tests and design guards
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: accessibility · PWA
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The Playwright webServer block runs the production build, because that
      # is the only mode where the service worker registers.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility and PWA suite
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
